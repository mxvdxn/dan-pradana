name: Build editorial advertising case studies
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_case_studies.py'
      - 'portfolio-assets/danifpradana-portfolio/assets/editorial.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dan-pradana-case-studies
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout Dan Pradana
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Render all original campaigns with editorial storytelling
        run: python3 scripts/build_case_studies.py
      - name: Commit rendered case studies and preserve source pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio-assets/danifpradana-portfolio/projects portfolio-assets/danifpradana-portfolio/original-pages
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Rewrite all 14 advertising case studies with editorial narrative and design"
          git push origin HEAD:main
