name: Import The Dead Mall infographic

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag of GitHub release containing the approved infographic PNG"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: dan-pradana-dead-mall-image
  cancel-in-progress: false

jobs:
  import-image:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'dead-mall-art-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Dan Pradana
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download attached approved image
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dead-mall-image"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.png' --dir "$RUNNER_TEMP/dead-mall-image"
          count="$(find "$RUNNER_TEMP/dead-mall-image" -maxdepth 1 -type f -iname '*.png' | wc -l)"
          test "$count" -eq 1
          image="$(find "$RUNNER_TEMP/dead-mall-image" -maxdepth 1 -type f -iname '*.png' -print -quit)"
          test "$(file --brief --mime-type "$image")" = "image/png"
          mkdir -p assets
          cp "$image" assets/dead-mall-performance.png

      - name: Commit the original graphic into the portfolio repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dead-mall-performance.png
          if ! git diff --cached --quiet; then
            git commit -m "Host approved The Dead Mall performance infographic on GitHub"
            git push origin HEAD:main
          fi
